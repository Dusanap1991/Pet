<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notas</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      html, body { height: 100%; }
      main { height: 100%; padding: 14px 16px 12px; gap: 8px; }
      textarea {
        flex: 1;
        width: 100%;
        resize: none;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--field);
        color: var(--fg);
        font: 14.5px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .hint { margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <textarea id="notes" aria-label="Notas" placeholder="Escribe lo que quieras recordar: ideas, datos, la lista del súper…" spellcheck="true"></textarea>
      <p class="hint" id="status" role="status">Se guarda solo.</p>
    </main>
    <script src="notes.js"></script>
  </body>
</html>
