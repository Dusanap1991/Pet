<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuevo recordatorio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form id="form" autocomplete="off">
      <label class="field">
        <span>¿Qué te recuerdo?</span>
        <input id="text" type="text" maxlength="120" placeholder="Llamar a Ana" required autofocus />
      </label>

      <fieldset>
        <legend>¿Cuándo?</legend>
        <label class="row">
          <input type="radio" name="mode" value="in" checked />
          <span>En</span>
          <input id="minutes" type="number" min="1" max="1440" value="20" />
          <span>minutos</span>
        </label>
        <label class="row">
          <input type="radio" name="mode" value="at" />
          <span>A las</span>
          <input id="time" type="time" />
        </label>
        <div class="row sub">
          <span>Repetir</span>
          <select id="repeat" aria-label="Repetir">
            <option value="none">No</option>
            <option value="daily">Todos los días</option>
            <option value="weekdays">De lunes a viernes</option>
            <option value="weekly">Cada semana, el</option>
          </select>
          <select id="weekday" aria-label="Día de la semana">
            <option value="1">lunes</option>
            <option value="2">martes</option>
            <option value="3">miércoles</option>
            <option value="4">jueves</option>
            <option value="5">viernes</option>
            <option value="6">sábado</option>
            <option value="0">domingo</option>
          </select>
        </div>
        <label class="row">
          <input type="radio" name="mode" value="date" />
          <span>El día</span>
          <input id="date" type="date" />
          <span>a las</span>
          <input id="dateTime" type="time" value="09:00" />
        </label>
        <label class="row sub">
          <input id="yearly" type="checkbox" />
          <span>Repetir cada año (cumpleaños, aniversarios)</span>
        </label>
      </fieldset>

      <p id="error" role="alert"></p>

      <div class="actions">
        <button type="button" id="cancel">Cancelar</button>
        <button type="submit" class="primary">Guardar</button>
      </div>
    </form>
    <script src="reminder.js"></script>
  </body>
</html>
