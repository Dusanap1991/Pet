name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Los instaladores solo se generan a pedido (botón "Run workflow") o al
  # publicar un tag vX.Y.Z, porque los runners de macOS consumen más minutos.
  package:
    name: Instalador (${{ matrix.name }})
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            files: release/*.exe
          - os: macos-latest
            name: macOS
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
        env:
          PET_BUILD: ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: Pet-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14

  # Publica los instaladores y el paquete de actualización. La app instalada
  # consulta la última release y se actualiza sola (ver src/main/updater.ts).
  release:
    name: Publicar
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Paquete de actualización
        env:
          PET_BUILD: ${{ github.run_number }}
        run: npm run build && node scripts/make-update.mjs installers
      - uses: actions/download-artifact@v7
        with:
          path: installers
          merge-multiple: true
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: >
          gh release create "$TAG" installers/*
          --repo "${{ github.repository }}"
          --target "${{ github.sha }}"
          --title "Pet (compilación ${{ github.run_number }})"
          --notes "Instaladores sin firmar. Mac con procesador M: archivo arm64.dmg. Windows: archivo .exe. Si ya tienes Pet instalado no hace falta bajar nada: se actualiza solo."
          --latest
